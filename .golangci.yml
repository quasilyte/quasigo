{
  "version": "2",
  "run": {
    # timeout for analysis, e.g. 30s, 5m, default is no timeout
    "timeout": "3m",
  },
  "linters": {
    # errcheck, govet, ineffassign, staticcheck (includes gosimple), unused
    "default": "standard",
    "enable": [
      "gocritic",
      "gosec",
      "misspell",
      "nakedret",
      "unconvert",
    ],
    "settings": {
      "gocritic": {
        "enabled-checks": [
          "commentedOutCode",
        ],
      },
      "gosec": {
        "excludes": [
          # Integer conversions are a part of the slots data reinterpretation.
          "G115",
        ],
      },
    },
    "exclusions": {
      # Same as the v1 default exclude rules.
      "presets": [
        "comments",
        "common-false-positives",
        "legacy",
        "std-error-handling",
      ],
    },
  },
  "formatters": {
    "enable": [
      "gofmt",
      "goimports",
    ],
  },
}
